  x.globalAlpha=1;
  x.textAlign='center';x.textBaseline='middle';
  for(const p of pops){x.globalAlpha=Math.min(1,p.life*2);x.fillStyle=p.col;x.font='bold '+(26*S)+'px system-ui,sans-serif';x.fillText(p.t,p.x,p.y)}
  x.globalAlpha=1;
  // HUD
  x.textAlign='left';x.fillStyle='#fff';x.font='bold '+(40*S)+'px system-ui,sans-serif';x.fillText('🍉 '+score,20,44*S);
  x.font=(16*S)+'px system-ui,sans-serif';x.fillStyle='#d9c3a5';x.fillText('Best '+best,24,76*S);
  x.textAlign='right';x.font=(30*S)+'px system-ui,sans-serif';
  let l='';for(let i=0;i<3;i++)l+=i<lives?'❤️ ':'🖤 ';x.fillText(l,W-16,42*S);
  // screens
  if(state!=='play'){
    x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#fff';
    x.font='900 '+(Math.min(72,W/9))*S/S+'px system-ui,sans-serif';
    x.fillText(state==='menu'?'HEAD NINJA':'GAME OVER',W/2,H*.36);
    x.font=(24*S)+'px system-ui,sans-serif';x.fillStyle='#ffd60a';
    if(state==='over'){x.fillText('Score '+score+(score>=best&&score>0?'  — new best!':'   Best '+best),W/2,H*.46)}
    else{x.fillStyle='#d9c3a5';x.fillText('Swipe your head through the fruit. Dodge the bombs 💣',W/2,H*.46)}
    x.fillStyle='#fff';x.font='bold '+(26*S)+'px system-ui,sans-serif';
    x.fillText(state==='menu'?'Click or tap to start':'Click or tap to play again',W/2,H*.58);
  }
  if(flash>0){x.fillStyle='rgba(255,255,255,'+flash*.8+')';x.fillRect(0,0,W,H)}
  x.restore();
  // the image IS the cursor
  if(img.complete&&img.naturalWidth){const w=Math.max(80,Math.min(130,H*.17))*1,h=w*img.naturalHeight/img.naturalWidth;
    x.save();x.translate(dx,dy);x.rotate(tilt);x.shadowColor='rgba(0,0,0,.5)';x.shadowBlur=14;x.drawImage(img,-w/2,-h/2,w,h);x.restore()}
}
let last=performance.now();
function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
